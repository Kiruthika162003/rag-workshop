[project]
name = "rag-workshop"
version = "1.0.0"
description = "Text, multimodal, graph and agentic RAG over messy company files"
requires-python = ">=3.11"
dependencies = [
    "google-adk",
    "google-genai",
    "pymupdf>=1.26,<2",
    "numpy",
    "flask",
    "python-dotenv",
]

[project.optional-dependencies]
data = ["matplotlib", "imageio", "imageio-ffmpeg"]
test = ["pytest"]

[tool.setuptools]
packages = ["core"]
